; Sales Entry — JC3248W535C portrait 320x480 (native panel, no rotation)
; Upload: HOLD BOOT → Upload → bitawan BOOT pag "Writing..."

[platformio]
default_envs = jc3248w535c
description = Sales Entry portrait full UI 320x480

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    lvgl/lvgl@8.4.0
    mobizt/ESP Mail Client@3.4.24
lib_ldf_mode = deep+
extra_scripts =
    pre:extra/fix_deps.py
    pre:extra/pre_upload.py
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
upload_protocol = esptool
upload_speed = 115200
board_upload.wait_for_upload_port = 30
upload_flags =
    --before=no_reset
    --after=hard_reset
    --connect-attempts=15
    --chip=esp32s3
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I include/app
    -I include/ui
    -DAPP_MAX_ENTRIES=40
    -DAPP_MAX_ARCHIVED=20
    -DAPP_MAX_SENT_KEYS=32
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    -DDISABLE_IMAP
    -DDISABLE_FLASH
    -DDISABLE_SD
    ; External WiFiClient in app_mail.cpp — avoids WiFi.h in lib build (PIO include path)
    -DESP_MAIL_DISABLE_ONBOARD_WIFI

; Primary — full Sales UI, portrait 320x480, native AXS15231B (no rotation)
[env:jc3248w535c]
extends = common
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    ${common.build_flags}
    -DBOARD_PROFILE=0
    -DBOARD_INIT_TYPE=0
    -DBOARD_QSPI_HZ=8000000
    -DBOARD_USE_CANVAS=1
    -DAPP_SCREEN_W=320
    -DAPP_SCREEN_H=480
    -DAPP_DEBUG_AGENT=0
    -DAPP_EMAIL_SIMULATE=0
    -DAPP_MAIL_ON_DEVICE=1
    -DLVGL_BUF_LINES=60
build_src_filter =
    +<*>
    -<ui_sales_sample.cpp>
    -<app/app_storage_nvs.cpp>

; Minimal layout test (no NVS / full ui_sales)
[env:jc3248_sample]
extends = common
build_flags =
    ${common.build_flags}
    -DAPP_USE_SAMPLE_UI=1
    -DBOARD_PROFILE=0
    -DBOARD_INIT_TYPE=0
    -DBOARD_QSPI_HZ=8000000
    -DBOARD_USE_CANVAS=1
    -DAPP_SCREEN_W=320
    -DAPP_SCREEN_H=480
build_src_filter =
    +<*>
    -<ui/ui_sales.c>
    -<ui/ui_keypad.c>
    -<app/app_data.c>
    -<app/app_mail.cpp>
    -<app/app_storage_nvs.cpp>

; Experimental landscape 480x320 (unstable on some units — use only if needed)
[env:jc3248_landscape]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_PROFILE=0
    -DBOARD_INIT_TYPE=0
    -DBOARD_QSPI_HZ=8000000
    -DBOARD_GFX_ROTATION=1
    -DBOARD_USE_CANVAS=1
    -DAPP_SCREEN_W=480
    -DAPP_SCREEN_H=320
build_src_filter =
    +<*>
    -<ui_sales_sample.cpp>

; Full-frame LVGL refresh (slower; use if partial refresh shows keypad glitches)
; Same firmware with debug symbols (clearer panic backtraces in monitor)
[env:jc3248w535c_debug]
extends = jc3248w535c
build_type = debug

[env:jc3248_fullrefresh]
extends = jc3248w535c
build_flags =
    ${env:jc3248w535c.build_flags}
    -DLVGL_FULL_REFRESH=1

[env:jc3248_type2]
extends = jc3248w535c
build_flags =
    ${env:jc3248w535c.build_flags}
    -DBOARD_INIT_TYPE=1

[env:jc3248_swap]
extends = jc3248w535c
build_flags =
    ${env:jc3248w535c.build_flags}
    -DLV_COLOR_16_SWAP=1
